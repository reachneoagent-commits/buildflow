name: Release

# Builds Buildflow for macOS and Windows and publishes a GitHub release.
# Run it from the Actions tab (Release > Run workflow). The version comes from Cargo.toml.
# Installers are unsigned unless the signing secrets (see packaging/) are added to the repo.
# This file is Buildflow's own; upstream's release workflow needs their signing secrets.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebrand is complete
        run: python3 rebrand/apply.py --check
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Build universal DMG
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/release/*.dmg
            dist/release/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if ('${{ matrix.arch }}' -eq 'arm64') { rustup target add aarch64-pc-windows-msvc } else { rustup target add x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build MSI and portable zip
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, notes and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && /^version/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          UPSTREAM="$(python3 -c 'import json;print(json.load(open("rebrand/upstream.json"))["tag"])')"
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          {
            echo "Buildflow $VERSION for macOS and Windows, built on Craft Anything $UPSTREAM."
            echo
            echo "## Downloads"
            echo "- **macOS** (Apple silicon and Intel): buildflow-$VERSION-macos-universal.dmg"
            echo "- **Windows** (x64 and ARM64): the .msi installer, or the -portable.zip with no install"
            echo
            echo "Check downloads against SHA256SUMS.txt. These builds aren't signed with a paid Apple or Microsoft certificate, so your computer will warn you the first time you open Buildflow. The easiest way to install and update is the FlowApps launcher."
            echo
            echo "What changed upstream: https://github.com/storytold/craft-anything/releases/tag/$UPSTREAM"
          } > notes.md
          gh release create "v$VERSION" dist/* --title "Buildflow v$VERSION" --notes-file notes.md --latest
